<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều Kiện Xét Tốt Nghiệp - Premium</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- AdminLTE css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <style>
        /* Hiệu ứng hover cho dòng trong bảng */
        .table-hover tbody tr {
            transition: all 0.3s ease-in-out;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(0, 123, 255, 0.08) !important;
            transform: scale(1.01);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Hiệu ứng hover cho nút bấm (Sửa/Xóa) */
        .btn {
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
            <li class="nav-item d-none d-sm-inline-block">
                <a href="graduation-conditions.html" class="nav-link">Home</a>
            </li>
        </ul>
    </nav>
    <!-- /.navbar -->

    <!-- Main Sidebar Container -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a href="students.html" class="brand-link">
            <span class="brand-text font-weight-light">Hệ Thống Quản Lý</span>
        </a>

        <!-- Sidebar -->
        <div class="sidebar">
            <nav class="mt-2">
                <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                    <li class="nav-item">
                        <a href="students.html" class="nav-link">
                            <i class="nav-icon fas fa-user-graduate"></i>
                            <p>Quản Lý Sinh Viên</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="graduation-conditions.html" class="nav-link active">
                            <i class="nav-icon fas fa-list-alt"></i>
                            <p>Điều Kiện Tốt Nghiệp</p>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="graduation-results.html" class="nav-link">
                            <i class="nav-icon fas fa-graduation-cap"></i>
                            <p>Kết Quả Tốt Nghiệp</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <section class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1>Quản Lý Điều Kiện Tốt Nghiệp</h1>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <div class="container-fluid">
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">Thêm Điều Kiện Mới</h3>
                    </div>
                    <form id="addForm">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 form-group">
                                    <label>Khóa áp dụng</label>
                                    <input type="text" class="form-control" id="cohort" required placeholder="VD: K22">
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>Số tín chỉ tối thiểu</label>
                                    <input type="number" class="form-control" id="minCredits" required placeholder="VD: 150">
                                </div>
                                <div class="col-md-4 form-group">
                                    <label>GPA Tối thiểu</label>
                                    <input type="number" step="0.01" class="form-control" id="minGpa" required placeholder="VD: 2.0">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Số tín chỉ nợ tối đa</label>
                                    <input type="number" class="form-control" id="maxFailed" value="0" required placeholder="VD: 0">
                                </div>
                                <div class="col-md-6 form-group">
                                    <label>Chuẩn Tiếng Anh</label>
                                    <input type="text" class="form-control" id="englishReq" placeholder="VD: TOEIC 450, B1...">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Lưu Thông Tin</button>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Danh Sách Điều Kiện</h3>
                    </div>
                    <div class="card-body table-responsive p-0">
                        <table class="table table-hover text-nowrap">
                            <thead>
                                <tr>
                                    <th>Khóa</th>
                                    <th>Tín Chỉ Tối Thiểu</th>
                                    <th>GPA Tối Thiểu</th>
                                    <th>Tín Chỉ Nợ CĐ</th>
                                    <th>Chuẩn Tiếng Anh</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer class="main-footer">
        <strong>Quản Lý Đào Tạo - Premium</strong>
    </footer>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<script>
    const API_URL = '/api/graduation-conditions';

    async function fetchConditions() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.appliedCohort}</strong></td>
                    <td>${item.minTotalCredits}</td>
                    <td><strong>${item.minGpa}</strong></td>
                    <td class="text-danger">${item.maxFailedCredits}</td>
                    <td>${item.englishRequirement || 'Không yêu cầu'}</td>
                    <td>
                        <button onclick="deleteCondition('${item.id}')" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error("Lỗi khi tải dữ liệu:", error);
        }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const payload = {
            programId: "00000000-0000-0000-0000-000000000000",
            appliedCohort: document.getElementById('cohort').value,
            minTotalCredits: parseInt(document.getElementById('minCredits').value),
            minGpa: parseFloat(document.getElementById('minGpa').value),
            maxFailedCredits: parseInt(document.getElementById('maxFailed').value),
            englishRequirement: document.getElementById('englishReq').value
        };

        await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        document.getElementById('addForm').reset();
        fetchConditions(); 
    });

    async function deleteCondition(id) {
        if(confirm('Bạn có chắc muốn xóa điều kiện này?')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchConditions(); 
        }
    }

    document.addEventListener('DOMContentLoaded', fetchConditions);
</script>
</body>
</html>
